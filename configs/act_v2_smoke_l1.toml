version = "v4"
action_loss = "l1"
batch_size = 8
steps = 12
lr = 1e-4
seed = 0
beta = 0.01
beta_start = 0.001
beta_warmup_steps = 6
checkpoint_every = 6
use_z = true
image_keys = ["agentview_image", "robot0_eye_in_hand_image"]

[tensorboard]
activations = true
batch_metrics = true
denorm_l1 = true
epoch_metrics = true
eval = true
hyperparams = true
latent = true
lr = true
optimizer = true
ranges = true
sensitivity = true
throughput = true
timing = true
