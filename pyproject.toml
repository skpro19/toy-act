[project]
name = "toy-act"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "huggingface-hub>=1.32.0",
    "ipython>=9.17.1",
    "mujoco==3.2.3",
    "robomimic",
    "robosuite",
    "torch==2.10.0",
]

[dependency-groups]
train = [
    "h5py>=3.16.0",
    "tensorboard>=2.21.0",
    "torch==2.10.0",
    "tqdm>=4.70.1",
]

[tool.uv]
override-dependencies = ["huggingface_hub", "diffusers>=0.40.0", "transformers>=5.0.0"]

[tool.uv.sources]
robomimic = { path = "third_party/robomimic", editable = true }
robosuite = { path = "third_party/robosuite", editable = true }
