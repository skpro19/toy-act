[project]
name = "toy-act"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "huggingface-hub>=1.32.0",
    "ipython>=9.17.1",
    "torch==2.10.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
]
train = [
    "boto3>=1.43.98",
    "h5py>=3.16.0",
    "mujoco==3.2.3",
    "robomimic",
    "robosuite",
    "tensorboard>=2.21.0",
    "torch==2.10.0",
    "tqdm>=4.70.1",
]

[tool.uv]
override-dependencies = ["huggingface_hub", "diffusers>=0.40.0", "transformers>=5.0.0"]
default-groups = ["dev", "train"]

[tool.uv.sources]
robomimic = { git = "https://github.com/ARISE-Initiative/robomimic.git", rev = "d309eaecc18acf4152a830a895a6984b8ac71b05" }
robosuite = { git = "https://github.com/ARISE-Initiative/robosuite.git", rev = "a071383d53568ab798eb315c0e95357911be922d" }
